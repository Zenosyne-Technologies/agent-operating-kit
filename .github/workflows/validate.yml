name: validate-kit
on:
  pull_request:
  push:
    branches: [main, develop, 'release/**']
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run static release gate
        run: bash scripts/validate-kit.sh
      - name: Run migration tests
        run: bash scripts/test-migrations.sh
      - name: Run SessionStart hook tests
        run: bash scripts/test-session-hook.sh
      - name: Run context-budget hook tests
        run: bash scripts/test-context-budget.sh
      - name: Run CLAUDE.md split planner tests
        run: bash scripts/test-claude-md-split.sh
      - name: Run whats-new aggregator tests
        run: bash scripts/test-whats-new.sh
      - name: Run worktree sweep tests
        run: bash scripts/test-worktree-sweep.sh
      - name: Run worktree marker tests
        run: bash scripts/test-worktree-mark.sh
      - name: Run run-state sync tests
        run: bash scripts/test-runs-sync.sh
      - name: Run Docker sweep tests
        run: bash scripts/test-docker-sweep.sh
      - name: Run hook library tests
        run: bash scripts/test-hook-lib.sh
      - name: Run update gate tests
        run: bash scripts/test-update-gate.sh
      - name: Run sub-agent hook tests
        run: bash scripts/test-subagent-hooks.sh
      - name: Run brief lint tests
        run: bash scripts/test-brief-lint.sh
      - name: Run Docker lint tests
        run: bash scripts/test-docker-lint.sh
      - name: Run ticket lint tests
        run: bash scripts/test-ticket-lint.sh
      - name: Run style-plugin finder tests
        run: bash scripts/test-style-plugins.sh
  windows:
    # Git Bash on windows-latest: the hooks are bash scripts. First run pending (cannot be verified before a push).
    continue-on-error: true   # until its first green run — then remove this line
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      MSYS: winsymlinks:nativestrict   # real symlinks (the runner is admin); the symlink-refusal fixtures need them
    steps:
      - name: Point TMPDIR at the runner temp, in Git Bash form
        # Without this /tmp (MSYS, under the Git install) and the C:/... paths git and the runner report are
        # different spellings of different directories; the marker and sweep fixtures compare physical paths.
        run: echo "TMPDIR=$(cygpath -u "$RUNNER_TEMP")" >> "$GITHUB_ENV"
      - name: Keep LF line endings and native symlinks (a CRLF-mangled bash script fails)
        run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true
      - uses: actions/checkout@v4
      - name: Run worktree sweep tests
        run: bash scripts/test-worktree-sweep.sh
      - name: Run SessionStart hook tests
        run: bash scripts/test-session-hook.sh
      - name: Run hook library tests
        run: bash scripts/test-hook-lib.sh
      - name: Run ticket lint tests
        run: bash scripts/test-ticket-lint.sh
      - name: Run worktree marker tests
        run: bash scripts/test-worktree-mark.sh
      - name: Run run-state sync tests
        run: bash scripts/test-runs-sync.sh
